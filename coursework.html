<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coursework | Matt Kuehr</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            color: #e0e0e0;
        }

        header {
            background-color: #162447;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background-color: #1b1b32;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
        }

        ul.course-list {
            list-style-type: none;
            padding: 0;
        }

        ul.course-list li {
            background-color: #1f4068;
            margin: 10px 0;
            padding: 15px;
            border-radius: 6px;
            font-size: 18px;
        }

        footer {
            background-color: #162447;
            text-align: center;
            padding: 10px;
            position: relative;
            bottom: 0;
            width: 100%;
        }

        a.nav-link {
            color: #00bcd4;
            text-decoration: none;
        }

        a.nav-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

            </a>
